<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="MBTI人格鉴定所——废柴题壳，正经计分，28题测出你的16型人格与专属人设卡">
<title>MBTI人格鉴定所</title>
<style>
:root{
  --pink:#FFB7C5; --pink-deep:#FF8FAB; --cream:#FFF6E9; --mint:#B8E6D3;
  --lavender:#D9C7F0; --butter:#FFE7A0; --sky:#A8D8F0; --peach:#FFCBB0;
  --ink:#5B4A54; --ink-soft:#8A7A82; --card:#FFFFFF;
  --shadow:0 6px 20px rgba(180,140,160,.18);
  --radius:20px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--ink); background:var(--cream); line-height:1.6;
  background-image:radial-gradient(circle at 12% 8%,rgba(255,183,197,.35) 0 22%,transparent 23%),
    radial-gradient(circle at 88% 15%,rgba(184,230,211,.4) 0 18%,transparent 19%),
    radial-gradient(circle at 85% 88%,rgba(217,199,240,.4) 0 20%,transparent 21%),
    radial-gradient(circle at 8% 85%,rgba(255,231,160,.5) 0 15%,transparent 16%);
  background-attachment:fixed; min-height:100vh;
}
#app{max-width:640px;margin:0 auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom))}
/* ---------- 通用 ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 20px;margin-bottom:16px}
.btn{
  display:block;width:100%;border:none;cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,var(--pink) 0%,var(--pink-deep) 100%);
  color:#fff;font-size:1.05rem;font-weight:700;border-radius:16px;
  padding:14px 20px;transition:transform .15s ease,box-shadow .15s ease;box-shadow:0 4px 14px rgba(255,143,171,.4);
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--pink);box-shadow:none;font-weight:600}
.btn.mini{width:auto;display:inline-block;padding:8px 18px;font-size:.9rem;border-radius:12px}
.tag{display:inline-block;background:var(--butter);color:#9A7B2D;border-radius:999px;padding:2px 12px;font-size:.8rem;font-weight:600;margin:2px 3px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px dashed var(--pink);border-radius:999px;padding:4px 14px;font-size:.85rem;color:var(--ink-soft)}
h1,h2,h3{line-height:1.35}
.muted{color:var(--ink-soft);font-size:.85rem}
.center{text-align:center}
/* ---------- 首页 ---------- */
.hero{text-align:center;padding:34px 18px 26px}
.hero .logo{font-size:3.6rem;display:block;margin-bottom:8px;filter:drop-shadow(0 4px 8px rgba(255,143,171,.35))}
.hero h1{font-size:1.9rem;letter-spacing:.05em}
.hero h1 .en{display:block;font-size:.75rem;color:var(--ink-soft);letter-spacing:.35em;margin-top:6px;font-weight:400}
.hero .slogan{margin:14px auto 4px;max-width:26em}
.stat-row{display:flex;gap:10px;justify-content:center;margin:18px 0 4px;flex-wrap:wrap}
.stat-row .pill b{color:var(--ink)}
/* ---------- 答题页 ---------- */
.progress-wrap{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.progress-bar{flex:1;height:10px;background:#F3E3E8;border-radius:999px;overflow:hidden}
.progress-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--pink));border-radius:999px;transition:width .3s ease}
.progress-num{font-size:.85rem;color:var(--ink-soft);font-weight:700;white-space:nowrap}
.qcard{position:relative;overflow:hidden}
.qcard .qtag{margin-bottom:10px}
.qcard h2{font-size:1.18rem;margin-bottom:20px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{
  border:2.5px solid #F0E0E6;background:#FFFDFB;border-radius:16px;padding:14px 16px;
  cursor:pointer;font-size:.98rem;transition:all .18s ease;display:flex;gap:10px;align-items:flex-start;text-align:left;
}
.opt .badge{flex:none;width:26px;height:26px;border-radius:50%;background:#F6E8ED;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;margin-top:1px}
.opt:active{transform:scale(.98)}
.opt.picked{border-color:var(--pink-deep);background:#FFF0F4;box-shadow:0 4px 12px rgba(255,143,171,.25)}
.opt.picked .badge{background:var(--pink-deep);color:#fff}
@media (hover:hover){.opt:hover{border-color:var(--pink);background:#FFF7FA}}
.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.q-nav .back{background:none;border:none;color:var(--ink-soft);font-size:.9rem;cursor:pointer;padding:8px 4px;font-family:inherit}
.q-nav .back:disabled{opacity:.3;cursor:default}
/* ---------- 结果页 ---------- */
.result-hero{text-align:center;position:relative;overflow:hidden}
.result-hero .type{font-size:3rem;font-weight:900;letter-spacing:.08em;background:linear-gradient(120deg,#FF8FAB,#B88FD9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.result-hero .role-emoji{font-size:4rem;display:block;filter:drop-shadow(0 6px 10px rgba(180,140,160,.3))}
.result-hero .role-name{font-size:1.5rem;font-weight:800;margin-top:6px}
.result-hero .role-title{color:var(--ink-soft);margin-top:2px}
.result-hero .quote{font-style:italic;color:var(--ink-soft);margin-top:12px}
.dims{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.dims{grid-template-columns:1fr}}
.dim{background:#FFF9FB;border-radius:14px;padding:12px 14px}
.dim .dim-head{display:flex;justify-content:space-between;font-weight:700;font-size:.9rem;margin-bottom:8px}
.dim .dim-bar{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--sky) 50%,#F0E0E6 50%)}
.dim .dim-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--sky),var(--pink-deep))}
.dim .pct{display:flex;justify-content:space-between;font-size:.78rem;color:var(--ink-soft);margin-top:5px}
.egg{display:flex;gap:12px;background:linear-gradient(135deg,#FFF3F6,#F3F0FC);border-radius:14px;padding:12px 14px;margin-bottom:10px;align-items:flex-start}
.egg .egg-emoji{font-size:1.6rem;flex:none}
.egg .egg-name{font-weight:800;font-size:.92rem}
.egg .egg-text{font-size:.86rem;color:var(--ink-soft);margin-top:2px}
.report{background:#FFFBF2;border-radius:14px;padding:14px 16px;margin-bottom:10px}
.report .rep-head{display:flex;justify-content:space-between;align-items:baseline}
.report .rep-name{font-weight:800}
.report .rep-val{font-size:1.15rem;font-weight:900;color:#D98E23}
.report .rep-bar{height:10px;background:#F5EBDA;border-radius:999px;margin:8px 0 6px;overflow:hidden}
.report .rep-bar i{display:block;height:100%;background:linear-gradient(90deg,#FFD98E,#FF9F68);border-radius:999px}
.report .rep-note{font-size:.82rem;color:var(--ink-soft)}
/* ---------- 图鉴 ---------- */
.dex-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.dex-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:520px){.dex-grid{grid-template-columns:repeat(3,1fr)}}
.dex-cell{background:#FFF;border-radius:14px;padding:10px 6px;text-align:center;box-shadow:0 3px 10px rgba(180,140,160,.12)}
.dex-cell .d-emoji{font-size:1.7rem;display:block}
.dex-cell .d-type{font-weight:800;font-size:.85rem;margin-top:3px}
.dex-cell .d-name{font-size:.68rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dex-cell.locked{opacity:.42;filter:grayscale(.8)}
.dex-cell.locked .d-emoji{filter:blur(1px)}
.eggdex .egg.done{background:linear-gradient(135deg,#EFFAF4,#F3F0FC);border:1.5px dashed #9CCFB8}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px dashed #F0E0E6;font-size:.9rem}
.hist-item:last-child{border-bottom:none}
.hist-item .h-type{font-weight:800}
/* ---------- 弹窗 ---------- */
.toast{
  position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120%);z-index:99;
  background:var(--ink);color:#fff;padding:10px 22px;border-radius:999px;font-size:.9rem;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.2,1.4,.4,1);max-width:88vw;text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.footer-note{text-align:center;color:var(--ink-soft);font-size:.75rem;margin-top:22px;opacity:.8}
.egg-pop{
  position:fixed;inset:0;background:rgba(60,40,50,.45);z-index:98;display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.egg-pop.show{opacity:1;pointer-events:auto}
.egg-pop .inner{
  background:linear-gradient(150deg,#FFF6E9,#FFE9F0);border-radius:22px;padding:26px 22px;max-width:340px;width:100%;text-align:center;
  transform:scale(.8);transition:transform .3s cubic-bezier(.2,1.4,.4,1);box-shadow:0 20px 50px rgba(60,30,40,.35);
}
.egg-pop.show .inner{transform:scale(1)}
.egg-pop .pop-emoji{font-size:3.2rem;display:block;animation:bounce .8s ease infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.egg-pop h3{margin:10px 0 8px}
.egg-pop p{font-size:.9rem;color:var(--ink-soft)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fadeup{animation:fadeUp .45s ease both}
.fadeup.d1{animation-delay:.08s}.fadeup.d2{animation-delay:.16s}.fadeup.d3{animation-delay:.24s}.fadeup.d4{animation-delay:.32s}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="egg-pop" id="eggPop"><div class="inner" id="eggPopInner"></div></div>
<script>
// MBTI人格鉴定所 - 题库数据
// 维度: E/I（能量方向）、S/N（信息获取）、T/F（决策方式）、J/P（生活态度）
// 每题: q=题干, A/B=两个选项, a/b=选择该项时 +1 的维度极
// 题目顺序打乱排列，共 28 题（每维度 7 题）

const QUESTIONS = [
  // ===== E/I 维度（7 题）=====
  { q: "周五晚上八点，你的手机弹出三个饭局邀请，你：", A: "全都想去！人多了才热闹，先答应再想怎么串场", a: "E", B: "装没看见。电量只剩 20%，还是回家躺着吧", b: "I" },
  { q: "电梯里遇到不太熟的同事，你会：", A: "主动聊两句：'今天天气哈？周末有啥安排？'", a: "E", B: "掏出手机假装很忙，祈祷电梯快点到", b: "I" },
  { q: "朋友问你'在吗'，你的第一反应：", A: "秒回'在！咋了咋了'，顺便发个表情包", a: "E", B: "'等会儿，让我组织一下语言'", b: "I" },
  { q: "团建活动你更期待：", A: "KTV 麦克风焊在手里，或者桌游局当主持人", a: "E", B: "有沙发角落可以窝着，最好还有猫", b: "I" },
  { q: "独自待一整个周末，你会：", A: "主动约人！宅到第二天就浑身难受", a: "E", B: "如鱼得水。看书、追剧、发呆，充电拉满", b: "I" },
  { q: "刚认识的新朋友，你通常：", A: "聊半小时就知道对方的前任故事", a: "E", B: "认识三年还在'今天天气不错'的阶段", b: "I" },
  { q: "语音消息 60 秒 x 5 条发来了，你：", A: "直接回一条更长的语音", a: "E", B: "戴上耳机深吸一口气，做好心理建设再听", b: "I" },

  // ===== S/N 维度（7 题）=====
  { q: "朋友描述一个新手机，你最想先知道：", A: "多少钱？续航多少？跑分多少？", a: "S", B: "这玩意儿能改变人类的生活方式吗？", b: "N" },
  { q: "说明书摆在你面前，你会：", A: "一步不落地照做，做不出来的都是玄学", a: "S", B: "什么说明书？我拆了再说，装不回去再说", b: "N" },
  { q: "你更喜欢的聊天话题是：", A: "最近吃了啥、买了啥、哪个超市打折", a: "S", B: "如果人类灭亡只剩你一个，你会先干嘛", b: "N" },
  { q: "回忆上次旅行，你首先想到：", A: "民宿一晚 380，打车花了 200，牛肉面真香", a: "S", B: "那个落日下的大海，让我想到人生海海", b: "N" },
  { q: "收拾行李箱，你的风格是：", A: "列清单，按天配好穿搭，充电器放左前袋", a: "S", B: "先扔一堆进去，'差不多得了'，反正酒店有的买", b: "N" },
  { q: "同事说'这方案有股怪味儿'，你：", A: "具体是哪里怪？第几页？字体还是配色？", a: "S", B: "懂了！要的是那种'高级感'对吧？", b: "N" },
  { q: "学做一道新菜，你会：", A: "精确到克的菜谱 + 计时器，一步都不带差的", a: "S", B: "菜谱？凭感觉。盐少许是多少？我说了算", b: "N" },

  // ===== T/F 维度（7 题）=====
  { q: "朋友考试挂了，来找你哭诉，你：", A: "先看错在哪，下次怎么复习，问题出在哪个环节", a: "T", B: "抱抱！这老师出题也太变态了吧！", b: "F" },
  { q: "对象问'我和游戏哪个重要'，你：", A: "'游戏能陪我一辈子，你能吗'（并失去对象）", a: "T", B: "'当然是你！'（内心：这题是送命题）", b: "F" },
  { q: "网购收到有瑕疵的商品，你：", A: "截图、拍视频、附证据，找客服走流程索赔", a: "T", B: "算了算了，退换太麻烦，就当交个朋友", b: "F" },
  { q: "看剧时你更容易被什么打动：", A: "剧情逻辑严密、没有 bug，看完酣畅淋漓", a: "T", B: "主角哭了我也哭，BGM 一响眼泪就下来", b: "F" },
  { q: "同事的方案有明显漏洞，你：", A: "当众指出：第 3 页数据对不上，这不行", a: "T", B: "会后私聊：'那个……有个小地方要不要再看看？'", b: "F" },
  { q: "'对不起'和'我爱你'哪个更难说出口：", A: "对不起。错就是错，但道理我都懂，凭什么先低头", a: "T", B: "我爱你。对不起张口就来，我爱你得酝酿三天", b: "F" },
  { q: "朋友做了一桌很难吃的菜，你：", A: "'盐放多了，肉也柴了。不过米饭还行'", a: "T", B: "'太好吃了！'（内心：明天我自己带饭）", b: "F" },

  // ===== J/P 维度（7 题）=====
  { q: "旅行前一周，你的行程表：", A: "精确到小时，门票都买好了，Plan B 都备好了", a: "J", B: "目的地定了，其他……落地再说", b: "P" },
  { q: "deadline 还有三天，你：", A: "还剩三天？我早就交了", a: "J", B: "还有三天呢！今天先打两把游戏", b: "P" },
  { q: "你的桌面（电脑+实体），哪种更接近：", A: "分类清晰的文件夹，名字都是'2026项目-最终版-真最终版'", a: "J", B: "'新建文件夹(7)'里面套着'新建文件夹(2)'", b: "P" },
  { q: "计划好的周末突然被临时邀约打乱：", A: "有点烦。都说了周六要洗窗帘，我的人生不能乱", a: "J", B: "走！窗帘是死的，人是活的", b: "P" },
  { q: "点外卖时你通常：", A: "固定那三家轮着点，闭眼选不出错", a: "J", B: "每次都翻到列表最底下，寻找新大陆", b: "P" },
  { q: "Netflix 上有个剧让你上头，你：", A: "每晚看两集，再上头也得按计划来", a: "J", B: "通宵刷完，明天顶着黑眼圈上班/学", b: "P" },
  { q: "宜家说明书只给了图没给字，你：", A: "先分类零件、分步骤执行，工欲善其事必先利其器", a: "J", B: "图？什么图？我已经装到第三步了", b: "P" },
];

// MBTI人格鉴定所 - 16 位拟人角色设定
// name=角色名, title=称号, emoji=代表表情, quote=口头禅, bio=性格小传, tags=标签, rare=稀有度标记(1普通/2稀有/3神秘)
const ROLES = {
  "INTJ": { name: "诸葛再世", title: "运筹帷幄的幕后军师", emoji: "♟️", quote: "我早就说过了。", bio: "别人在睡觉，他在推演你的下一步。表情不多，脑子里已经跑了800个方案。表面上'随便'，实际上'必须按我的来'。他的世界里没有意外，只有预案。", tags: ["策略大师", "独行侠", "人间清醒"] },
  "INTP": { name: "祖传科学家", title: "灵魂出窍的思考者", emoji: "🧪", quote: "等等，这个逻辑不对。", bio: "和朋友聊天聊着聊着人就没了——灵魂去思考宇宙了。房間乱得像被抢劫，但脑子里的理论体系井井有条。约会迟到，是因为在路上发现了一只有趣的虫子。", tags: ["脑内宇宙", "拖延之神", "好奇宝宝"] },
  "ENTJ": { name: "霸总本总", title: "天生的指挥官", emoji: "👑", quote: "听我说，就这么办。", bio: "群里发通知的是他，规划路线的是他，催大家交钱的是他。朋友聚会有他在，就永远不缺方向。缺点是：连看电影都要做PPT分析剧情走向。", tags: ["行动派", "气场两米八", "卷王之王"] },
  "ENTP": { name: "抬杠小王子", title: "专职唱反调的辩论鬼才", emoji: "🃏", quote: "我不这么认为——", bio: "你说东他偏说西，不是杠，是'真理值得被辩论'。点子多到能开创意公司，可惜一半死在'懒得执行'。朋友又爱又恨：爱他有趣，恨他嘴欠。", tags: ["鬼点子批发商", "嘴强王者", "自由灵魂"] },
  "INFJ": { name: "神秘预言家", title: "温柔又通透的心灵导师", emoji: "🔮", quote: "我懂你的感受。", bio: "聚会结束会默默留下来帮忙收拾的人。看人极准，三句话就知道你最近过得好不好。表面平静，内心写了一部长篇小说。朋友圈文案：仅自己可见。", tags: ["人间清醒", "温柔刀", "读心术十级"] },

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

// ---------- 计分 ----------
function computeResult(answers){
  var score={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  QUESTIONS.forEach(function(q,i){
    var pick=answers[i];
    if(pick==='A')score[q.a]++;else if(pick==='B')score[q.b]++;
  });
  var type='';
  type+=score.E>score.I?'E':'I';
  type+=score.S>score.N?'S':'N';
  type+=score.T>score.F?'T':'F';
  type+=score.J>score.P?'J':'P';
  var dims=[
    {a:'E',b:'I',name:'能量来源',A:'外向 E',B:'内向 I'},
    {a:'S',b:'N',name:'信息获取',A:'实感 S',B:'直觉 N'},
    {a:'T',b:'F',name:'决策方式',A:'思考 T',B:'情感 F'},
    {a:'J',b:'P',name:'生活态度',A:'计划 J',B:'随性 P'}
  ].map(function(d){
    var total=score[d.a]+score[d.b];
    var pa=total>0?Math.round(score[d.a]/total*100):50;
    return {name:d.name,aLabel:d.A,bLabel:d.B,pa:pa,pb:100-pa,winner:pa>=50?d.a:d.b,extreme:total>0&&(score[d.a]===total||score[d.b]===total),total:total,scoreA:score[d.a],scoreB:score[d.b]};
  });
  return {type:type,dims:dims,score:score};
}

// ---------- 彩蛋判定 ----------
function detectEggs(res,ctx){
  var eggs=[];var store=getDex();
  // 1) 极端倾向
  res.dims.forEach(function(d){
    if(d.extreme){
      var eg=EXTREME_EGGS[d.winner];
      if(eg)eggs.push({cat:'extreme',key:'ext_'+d.winner,name:eg.name,emoji:eg.emoji,text:eg.text});
    }
  });
  // 2) 行为彩蛋
  var durs=ctx.durations.filter(function(x){return x>=0});
  var avg=durs.length?durs.reduce(function(a,b){return a+b},0)/durs.length:0;
  if(durs.length>=10&&avg<2000)eggs.push({cat:'behavior',key:'eg_speedrun',def:BEHAVIOR_EGGS.speedrun});
  if(durs.some(function(x){return x>15000}))eggs.push({cat:'behavior',key:'eg_overthink',def:BEHAVIOR_EGGS.overthink});
  if(ctx.flips>=3)eggs.push({cat:'behavior',key:'eg_flipflop',def:BEHAVIOR_EGGS.flipflop});
  if(ctx.totalMs>8*60*1000)eggs.push({cat:'behavior',key:'eg_slowpoke',def:BEHAVIOR_EGGS.slowpoke});
  if(durs.length>=10){
    var m=avg;var sd=Math.sqrt(durs.reduce(function(s,x){return s+Math.pow(x-m,2)},0)/durs.length);
    if(sd<700&&avg>2500&&avg<12000)eggs.push({cat:'behavior',key:'eg_goldilock',def:BEHAVIOR_EGGS.goldilock});
  }
  eggs=eggs.map(function(e){return e.def?{cat:e.cat,key:e.key,name:e.def.name,emoji:e.def.emoji,text:e.def.text}:e});
  // 3) 题目彩蛋
  QUESTION_EGGS.forEach(function(qe){
    var ans=ctx.answers[qe.qIndex];
    if((ans==='A'&&qe.choice==='A')||(ans==='B'&&qe.choice==='B'))
      eggs.push({cat:'question',key:'q_'+qe.key,name:qe.name,emoji:qe.emoji,text:qe.text});
  });
  return eggs;
}

// ---------- 另类小报告 ----------
function funReports(res,ctx){
  var s=res.score,durs=ctx.durations.filter(function(x){return x>=0});
  var avg=durs.length?durs.reduce(function(a,b){return a+b},0)/durs.length:3000;
  function bar(v){return Math.max(6,Math.min(98,v))}
  var waste=bar(38+(s.P*4)+(s.N*2.2)-(s.J*1.8)+(avg>6000?12:0));
  var battery=bar(15+s.I*7-s.E*4+(s.P>4?10:0));
  var hard=bar(22+s.T*6-s.F*3+(avg<2500?12:0));
  var luck=bar(35+((s.N+s.F+s.P)*2.1)+((ctx.flips===0)?8:0));
  var notes=[
    '浓度 '+waste+'%：'+(waste>75?'土豆本豆，建议直接躺平开发废柴天赋':waste>50?'有废柴潜质，但偶尔会突然争气一下':'你废柴得不太专业，请反思'),

  ];
  return [

    {def:FUN_REPORTS[1],val:battery,note:notes[1]},
    {def:FUN_REPORTS[2],val:hard,note:notes[2]},

}

  '<div class="progress-wrap"><div class="progress-bar"><i style="width:'+Math.round(qi/total*100)+'%"></i></div><span class="progress-num">'+(qi+1)+' / '+total+'</span></div>'+
  '<div class="card qcard fadeup" id="qcard">'+
    '<span class="pill qtag">🧾 鉴定中 · 第 '+(qi+1)+' 题</span>'+
    '<h2>'+esc(q.q)+'</h2>'+
    '<div class="opts">'+
      '<button class="opt" data-c="A"><span class="badge">A</span><span>'+esc(q.A)+'</span></button>'+
      '<button class="opt" data-c="B"><span class="badge">B</span><span>'+esc(q.B)+'</span></button>'+
    '</div>'+
  '</div>'+
  '<div class="q-nav">'+
    '<button class="back" id="btnBack"'+(qi===0?' disabled':'')+'>← 上一题</button>'+
    '<span class="muted">凭第一直觉选，别想太久</span>'+
  '</div>';
  var picked=null;
  var opts=$app.querySelectorAll('.opt');
  Array.prototype.forEach.call(opts,function(o){
    o.onclick=function(){
      if(picked)return;
      var dur=now()-state.qStartTime;
      state.qDurations[state.order[qi]]=dur;
      picked=o.getAttribute('data-c');
      state.answers[state.order[qi]]=picked;
      o.classList.add('picked');
      if(state.qDurations[state.order[qi]]>400&&dur<8000){/* noop */}
      setTimeout(function(){
        state.qIndex++;state.qStartTime=now();
        if(state.qIndex>=total)renderResult();else renderQuiz();
      },260);
    };
  });
  var back=document.getElementById('btnBack');
  if(back&&qi>0){back.onclick=function(){
    if(state.answers[state.order[state.qIndex]]!==null)state.flips++;
    state.qIndex--;
    state.qDurations[state.order[state.qIndex]]=-1;
    state.answers[state.order[state.qIndex]]=null;
    state.qStartTime=now();renderQuiz();
  }}
}

// ---------- 页面：结果 ----------
function renderResult(){
  var ctx={answers:state.answers,durations:state.qDurations,flips:state.flips,totalMs:now()-state.sessionStart};
  var res=computeResult(state.answers);
  var role=ROLES[res.type];
  var eggs=detectEggs(res,ctx);
  var reports=funReports(res,ctx);
  // 存储
  var dex=getDex();
  var newPersona=!dex.personas[res.type];
  dex.personas[res.type]={ts:now()};
  eggs.forEach(function(e){dex.eggDex[e.key]={ts:now()}});
  dex.history.push({ts:now(),type:res.type,eggs:eggs.map(function(e){return e.name})});
  if(dex.history.length>50)dex.history=dex.history.slice(-50);
  saveStore(dex);
  var n=Object.keys(dex.personas).length;
  var dimsHtml=res.dims.map(function(d){
    var left=d.pa;
    return '<div class="dim"><div class="dim-head"><span>'+esc(d.name)+'</span><span>'+(d.pa===50?'势均力敌':esc(d.winner)+' 倾向')+'</span></div>'+
    '<div class="dim-bar"><i style="width:'+left+'%"></i></div>'+
    '<div class="pct"><span>'+esc(d.aLabel)+' '+d.pa+'%</span><span>'+esc(d.bLabel)+' '+d.pb+'%</span></div>'+
    (d.extreme?'<div class="tag" style="margin-top:6px;background:#FFD9E2;color:#C24E6C">⚡ 100% 极端倾向</div>':'')+
    '</div>';
  }).join('');
  var eggsHtml=eggs.length?eggs.map(function(e){
    return '<div class="egg"><span class="egg-emoji">'+e.emoji+'</span><div><div class="egg-name">'+esc(e.name)+'</div><div class="egg-text">'+esc(e.text)+'</div></div></div>';
  }).join(''):'<p class="muted center" style="padding:8px 0">本轮暂未触发彩蛋，换个答法试试？</p>';
  var repHtml=reports.map(function(r){
    return '<div class="report"><div class="rep-head"><span class="rep-name">'+r.def.emoji+' '+esc(r.def.name)+'</span><span class="rep-val">'+r.val+'%</span></div>'+
    '<div class="rep-bar"><i style="width:'+r.val+'%"></i></div><div class="rep-note">'+esc(r.note)+'</div></div>';
  }).join('');
  $app.innerHTML=
  '<div class="card result-hero fadeup">'+
    '<span class="muted">🧾 鉴定完成 · 你的结果是</span>'+
    '<div class="type" style="margin:4px 0">'+res.type+'</div>'+
    '<span class="role-emoji">'+role.emoji+'</span>'+
    '<div class="role-name">'+esc(role.name)+'</div>'+
    '<div class="role-title">'+esc(role.title)+'</div>'+
    '<div class="quote">「'+esc(role.quote)+'」</div>'+
    (newPersona?'<div class="tag" style="margin-top:12px;background:#D9F2E6;color:#2E8B62">🎉 新人格解锁！图鉴 '+n+'/16</div>':'<div class="tag" style="margin-top:12px">🎭 图鉴 '+n+'/16</div>')+
  '</div>'+
  '<div class="card fadeup d1"><h3 style="margin-bottom:12px">🪪 角色小传</h3><p>'+esc(role.bio)+'</p><div style="margin-top:10px">'+role.tags.map(function(t){return '<span class="tag">#'+esc(t)+'</span>'}).join('')+'</div></div>'+
  '<div class="card fadeup d2"><h3 style="margin-bottom:12px">📊 四维倾向</h3><div class="dims">'+dimsHtml+'</div></div>'+
  '<div class="card fadeup d3"><h3 style="margin-bottom:12px">🥚 本轮彩蛋（'+eggs.length+'）</h3>'+eggsHtml+'</div>'+
  '<div class="card fadeup d4"><h3 style="margin-bottom:12px">📋 另类小报告</h3>'+repHtml+'<p class="muted" style="margin-top:4px">* 小报告数值由答题风格实时演算，纯属娱乐，请勿当真</p></div>'+
  '<div class="card fadeup d4">'+
    '<button class="btn" id="btnAgain">🔄 再测一次（换个答法解锁更多彩蛋）</button>'+
    '<div style="display:flex;gap:10px;margin-top:12px">'+
      '<button class="btn ghost" style="flex:1" id="btnDex2">📖 图鉴</button>'+
      '<button class="btn ghost" style="flex:1" id="btnHome2">🏠 回首页</button>'+
    '</div>'+
  '</div>'+
  '<p class="footer-note">本结果为娱乐向快测，不构成心理学专业意见 · MBTI人格鉴定所</p>';
  document.getElementById('btnAgain').onclick=function(){renderHome();document.getElementById('btnStart').click()};
  document.getElementById('btnDex2').onclick=function(){state.page='dex';renderDex()};
  document.getElementById('btnHome2').onclick=function(){state.page='home';renderHome()};
  // 新彩蛋弹窗（挑最新的一个）
  var fresh=eggs.filter(function(e){return !state.foundEggs.includes(e.key)});
  if(fresh.length){setTimeout(function(){showEggPop(fresh[0].name,fresh[0].emoji,fresh[0].text)},600)}
}

// ---------- 页面：图鉴 ----------
function renderDex(){
  var dex=getDex();
  var order=['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP','ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP'];
  var cells=order.map(function(t){
    var r=ROLES[t];var lit=!!dex.personas[t];
    return '<div class="dex-cell'+(lit?'':' locked')+'">'+
      '<span class="d-emoji">'+(lit?r.emoji:'❔')+'</span>'+
      '<div class="d-type">'+(lit?t:'？？？')+'</div>'+
      '<div class="d-name">'+(lit?esc(r.name):'未解锁')+'</div></div>';
  }).join('');
  var totalEggKeys=Object.keys(EXTREME_EGGS).length+Object.keys(BEHAVIOR_EGGS).length+QUESTION_EGGS.length;
  var eggList=[];
  Object.keys(EXTREME_EGGS).forEach(function(k){var e=EXTREME_EGGS[k];eggList.push({key:'ext_'+k,name:e.name,emoji:e.emoji,text:e.text})});
  Object.keys(BEHAVIOR_EGGS).forEach(function(k){var e=BEHAVIOR_EGGS[k];eggList.push({key:'eg_'+k,name:e.name,emoji:e.emoji,text:'触发条件：'+e.cond})});
  QUESTION_EGGS.forEach(function(qe){eggList.push({key:'q_'+qe.key,name:qe.name,emoji:qe.emoji,text:qe.text})});
  var eggHtml=eggList.map(function(e){
    var done=!!dex.eggDex[e.key];
    return '<div class="egg'+(done?' done':'')+'"><span class="egg-emoji">'+(done?e.emoji:'🥚')+'</span><div><div class="egg-name">'+(done?esc(e.name):'？？？')+'</div><div class="egg-text">'+(done?esc(e.text):'尚未发现 · 换种答法试试')+'</div></div></div>';
  }).join('');
  var n=Object.keys(dex.personas).length;
  $app.innerHTML=
  '<div class="card"><div class="dex-head"><h3>🎭 人格图鉴</h3><span class="pill">已收集 <b>'+n+'</b>/16</span></div><div class="dex-grid">'+cells+'</div></div>'+
  '<div class="card eggdex"><div class="dex-head"><h3>🥚 彩蛋图鉴</h3><span class="pill">已发现 <b>'+Object.keys(dex.eggDex).length+'</b>/'+totalEggKeys+'</span></div>'+eggHtml+'</div>'+
  '<button class="btn ghost" id="btnBackHome" style="margin-top:4px">← 返回</button>';
  document.getElementById('btnBackHome').onclick=function(){state.page='home';renderHome()};
}

// ---------- 页面：档案 ----------
function renderHist(){
  var dex=getDex();
  var hist=dex.history.slice().reverse();
  var html=hist.length?hist.map(function(h){
    return '<div class="hist-item"><div><span class="h-type">'+esc(h.type)+'</span> '+esc(ROLES[h.type].emoji)+' <span class="muted">'+(h.eggs&&h.eggs.length?'🥚×'+h.eggs.length:'')+'</span></div><span class="muted">'+esc(fmtTime(h.ts))+'</span></div>';
  }).join(''):'<p class="muted center" style="padding:14px 0">暂无鉴定记录，快去开始第一次鉴定吧！</p>';
  $app.innerHTML=
  '<div class="card"><div class="dex-head"><h3>🗂️ 鉴定档案</h3><span class="pill">共 <b>'+hist.length+'</b> 次</span></div>'+html+'</div>'+
  '<div style="display:flex;gap:10px"><button class="btn ghost" style="flex:1" id="btnBackHome">← 返回</button><button class="btn ghost" style="flex:1" id="btnClear">🗑️ 清空档案</button></div>';
  document.getElementById('btnBackHome').onclick=function(){state.page='home';renderHome()};
  document.getElementById('btnClear').onclick=function(){
    if(confirm('确定清空全部档案和图鉴吗？此操作不可恢复。')){saveStore({});state.page='home';renderHome();toast('已清空，一切重新开始')}
  };
}

// ---------- 启动 ----------
renderHome();
})();

</script>
</body>
</html>
